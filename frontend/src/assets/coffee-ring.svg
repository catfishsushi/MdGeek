<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- A faint coffee cup ring for the Author theme. The turbulence filter roughens the edges so it
       looks like a real dried stain rather than a perfect circle. -->
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="9"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <radialGradient id="pool" cx="0.45" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#8a5a2b" stop-opacity="0.05"/>
      <stop offset="0.85" stop-color="#8a5a2b" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#8a5a2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g filter="url(#rough)">
    <!-- faint tint inside the ring -->
    <circle cx="100" cy="100" r="74" fill="url(#pool)"/>
    <!-- the dark dried edge, heavier on one side, with a gap where the cup was lifted -->
    <circle cx="100" cy="100" r="76" fill="none" stroke="#6b3f17" stroke-opacity="0.32" stroke-width="3.5"
            stroke-dasharray="380 18 60 20"/>
    <circle cx="101" cy="99" r="72" fill="none" stroke="#7a4a1f" stroke-opacity="0.14" stroke-width="7"/>
    <!-- a second, partial ring from setting the cup down twice -->
    <path d="M40 140 A70 70 0 0 1 60 46" fill="none" stroke="#6b3f17" stroke-opacity="0.16" stroke-width="2.5"
          transform="translate(-14 10)"/>
  </g>
</svg>
