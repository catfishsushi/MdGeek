<!DOCTYPE html>
<html lang="en" class="th-light">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MdGeek</title>
</head>
<body>
<div id="app">
    <header id="toolbar">
        <div class="grp">
            <!-- The logo (the .mdGeek wordmark in the Light and Dark themes) opens a small panel with the version and "Check for updates". -->
            <div id="about-dd" class="dd">
                <button id="about-btn" class="brand" aria-haspopup="true" aria-expanded="false" aria-controls="about-menu"><span class="logo" aria-hidden="true">M&#x2193;</span><span class="bname">MdGeek</span><span class="md-wordmark"><span class="md-wordmark__prompt" aria-hidden="true">&gt;</span><span class="md-wordmark__text">.mdGeek</span><span class="md-wordmark__cursor" aria-hidden="true"></span></span></button>
                <div id="about-menu" class="menu about-menu" hidden>
                    <div class="menu-h">MdGeek</div>
                    <div id="about-version" class="about-version"></div>
                    <button id="btn-check-updates" class="opt">Check for updates</button>
                </div>
            </div>
            <button id="btn-sidebar" class="ib" aria-label="Explorer" aria-controls="sidebar" aria-expanded="true" title="Hide the Explorer pane (Ctrl+Shift+E)"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="strip" d="M5 4h4v16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
            <span class="sep"></span>
            <button id="btn-open-file" class="btn" title="Open file (Ctrl+O)" aria-label="Open file"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><span class="t">Open file</span></button>
            <button id="btn-open-folder" class="btn" title="Open folder (Ctrl+Shift+O)" aria-label="Open folder"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="t">Open folder</span></button>
        </div>
        <div id="view-toggle" class="seg" role="group" aria-label="Editor mode" title="Switch view (Ctrl+E)">
            <button class="seg-b" data-view="wysiwyg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>WYSIWYG</button>
            <button class="seg-b" data-view="source"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>Source</button>
        </div>
        <div class="grp end">
            <div class="exp" role="group" aria-label="Export">
                <span class="lbl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="t">Export</span></span>
                <button id="btn-export-html" title="Export as HTML">HTML</button>
                <button id="btn-export-pdf" title="Export as PDF (opens the print dialog)">PDF</button>
            </div>
            <span class="sep"></span>
            <div id="theme-dd" class="dd">
                <button id="theme-btn" class="sel" aria-haspopup="listbox" aria-expanded="false" aria-controls="theme-menu" aria-labelledby="theme-k theme-label">
                    <svg class="pal" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.9-.7-1.3-.7-2.2 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/></svg>
                    <span id="theme-k" class="k">Theme</span>
                    <span id="theme-label" class="v"></span>
                    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div id="theme-menu" class="menu" role="listbox" aria-label="Theme" hidden>
                    <div class="menu-h" aria-hidden="true">Theme</div>
                </div>
            </div>
        </div>
    </header>
    <div id="main">
        <aside id="sidebar">
            <div id="sidebar-head">
                <div class="side-name">
                    <div class="eyebrow">Explorer</div>
                    <div class="fname"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="sidebar-title">No folder open</span></div>
                </div>
                <div class="ibs">
                    <button id="btn-refresh" class="ib" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
                    <button id="btn-close-folder" class="ib" title="Close folder (the files stay on disk)" aria-label="Close folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                </div>
            </div>
            <div id="tree"></div>
            <div class="side-f"><span id="sidebar-count"></span><span id="sidebar-where"></span></div>
        </aside>
        <section id="content">
            <div id="tabs" class="tabs" role="tablist"></div>
            <!-- One file across the width, or two side by side for a split tab. main.ts builds the
                 two sides from the template. -->
            <div id="panes" hidden></div>
            <template id="pane-tpl">
                <div class="pane">
                    <div class="dochead" hidden>
                        <div class="crumb"></div>
                        <div class="status">
                            <span class="doc-status" role="status"><i class="dot"></i><span class="doc-status-text">Saved</span></span>
                            <span class="doc-kind">Markdown</span>
                            <span class="doc-acts">
                                <button class="ib doc-find" title="Find in this file (Ctrl+F)" aria-label="Find in this file"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
                                <button class="ib doc-reveal" title="Show in File Explorer" aria-label="Show in File Explorer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M11 13h6M14 10l3 3-3 3"/></svg></button>
                            </span>
                        </div>
                    </div>
                    <!-- Find in this file: Enter for the next match, Shift+Enter for the previous, Esc to close. -->
                    <div class="findbar" role="search" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
                        <input class="find-input" type="text" placeholder="Find in this file" aria-label="Find in this file" spellcheck="false" autocomplete="off"/>
                        <span class="find-count" aria-live="polite"></span>
                        <button class="ib find-prev" title="Previous match (Shift+Enter)" aria-label="Previous match"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
                        <button class="ib find-next" title="Next match (Enter)" aria-label="Next match"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
                        <button class="ib find-close" title="Close (Esc)" aria-label="Close find"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                    </div>
                    <div class="banner" hidden></div>
                    <div class="editor"></div>
                </div>
            </template>
            <div id="empty">
                <div class="drop">
                    <div class="big"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13l1.5 3 1.5-3 1.5 3 1.5-3"/></svg></div>
                    <h2>Open a Markdown file or folder to begin.</h2>
                    <p class="hint">You can also drop files here.</p>
                    <div class="acts">
                        <button id="btn-empty-file" class="btn pri"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Open file</button>
                        <button id="btn-empty-folder" class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Open folder</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div id="toast" role="status" hidden></div>
    <div id="modal" hidden></div>
</div>
<div id="print-root"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
